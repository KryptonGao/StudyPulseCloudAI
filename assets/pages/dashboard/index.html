<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StudyPulse Cloud AI</title>
  <link rel="stylesheet" href="/pages/dashboard/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand-lockup" href="/dashboard">
        <img class="brand-mark" src="/StudyPulseLogo.png" alt="">
        <div>
          <strong>StudyPulse</strong>
          <span>Cloud AI</span>
        </div>
      </a>
      <nav class="tabs">
        <a class="tab" data-page="/dashboard" href="/dashboard">Overview</a>
        <a class="tab" data-page="/contributions" href="/contributions">Contributions</a>
        <a class="tab" data-page="/security" href="/security">Security</a>
        <a class="tab" data-page="/feedback" href="/feedback">Feedback</a>
      </nav>
      <div class="sidebar-footer">
        <div class="account-meta">
          <span id="sidebarEmail" class="account-email"></span>
          <span id="sidebarPlan" class="account-plan"></span>
        </div>
        <button class="logout" type="button" onclick="logout()">退出</button>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <h1 id="pageTitle">Overview</h1>
        <div class="topbar-actions">
          <button class="btn btn-mobile-logout" type="button" onclick="logout()">退出</button>
          <button class="btn" type="button" onclick="refreshPage()">刷新</button>
        </div>
      </header>
      <section class="content">
        <div id="app" class="loading">加载中...</div>
      </section>
    </main>
  </div>
  <script src="/pages/dashboard/app.js" defer></script>
</body>
</html>
